# WireMock faz exatamente o papel de mockar HTTP ✅
# Ele é um mock server HTTP. Ou seja:
# Ele finge ser uma API externa real
# mas roda localmente e retorna respostas controladas por você
services:
  wiremock:
    image: wiremock/wiremock:3x
    ports:
      - "8787:8080"
    volumes:
      - ./etc/wiremock:/home/wiremock/mappings
    command: --verbose --disable-http2-plain
  algashop-postgres:
    image: postgres:17-alpine
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - algashop-postgres:/var/lib/postgresql/data
      - ./etc/postgres/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    healthcheck:
      test: pg_isready -U postgres -d postgres
      interval: 30s
      timeout: 10s
      retries: 3
  fastpay:
    image: algaworks/fastpay:latest
    restart: no
    ports:
      - 9995:9995
    depends_on:
      algashop-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      FASTPAY_HOSTNAME: http://localhost:9995
      DATABASE_JDBC_URL: jdbc:postgresql://algashop-postgres:5432/fastpay
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration, classpath:db/testdata
  # iniciando o cluster do mongo db
  algashop-mongodb-1:
    image: mongo:8
    # iniciando o comando de replica dentro do mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 27017:27017
    restart: no
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - algashop-mongodb-1:/data/db
  algashop-mongodb-2:
    image: mongo:8
    # iniciando o comando de replica dentro do mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 27018:27017
    restart: no
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - algashop-mongodb-2:/data/db
  algashop-mongodb-3:
    image: mongo:8
    # iniciando o comando de replica dentro do mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - 27019:27017
    restart: no
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - algashop-mongodb-3:/data/db
  # configurando um container para configuração de cluster via terminal
  # definindo o host primário e seus secundarios
  algashop-mongodb-init:
    image: mongo:8
    depends_on:
      algashop-mongodb-1:
        condition: service_healthy
      algashop-mongodb-2:
        condition: service_healthy
      algashop-mongodb-3:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command: >
      "
      echo 'Configuring MongoDB replica set...'

      mongosh --host algashop-mongodb-1 --eval '
        rs.initiate({
          _id: \"rs0\",
          members: [
            { _id: 0, host: \"algashop-mongodb-1:27017\", priority: 2},
            { _id: 1, host: \"algashop-mongodb-2:27017\", priority: 0},
            { _id: 2, host: \"algashop-mongodb-3:27017\", priority: 0}
          ]
        })
      ' || true;

      mongosh --host algashop-mongodb-1 --eval 'printjson(rs.status())'
      "
    restart: "no"
  algashop-redis:
    image: redis:8.4
    restart: unless-stopped
    ports:
      - 6379:6379
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:-algashop}",
      "--appendonly", "no",
      "--save", "",
      "--maxmemory", "480mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-algashop}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      REDIS_PASSWORD: algashop

  # LocalStack: a AWS emulada, para nao depender de conta nem de rede em desenvolvimento.
  #
  # O nome do servico importa mais do que parece. A URL pre-assinada que o catalogo gera
  # carrega o endpoint configurado - "http://algashop-localstack:4566/..." - e ela vai
  # para o NAVEGADOR, que precisa resolver esse nome. Por isso as tres linhas novas em
  # etc/hostnames/hostnames apontando o nome para 127.0.0.1. Em producao isso some: o
  # endpoint passa a ser o da AWS de verdade, que a internet ja resolve.
  algashop-localstack:
    image: localstack/localstack:4.13.1
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      DEBUG: 1 # ativa o debug
      SERVICES: s3, secretsmanager, ssm
      LS_ACCESS_KEY_ID: LSIAQAAAAAAVNCBMPNSG
      LS_SECRET_ACCESS_KEY: test
      LS_REGION: us-east-1
    healthcheck:
      # /_localstack/init/ready so devolve "completed": true depois que os scripts de
      # ready.d (init-aws.sh: parametros, secrets, bucket) terminaram. Sem isso, healthy
      # significava apenas "porta aberta" e os servicos corriam contra o seed - o
      # product-catalog chegou a subir antes do secret do redis existir.
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 20
    volumes:
      # ready.d: tudo que estiver aqui roda automaticamente quando os servicos ficam
      # prontos. E o que cria o bucket, aplica o CORS e carrega as imagens de exemplo,
      # sem nenhum passo manual depois do "docker compose up".
      - ./etc/aws/init.sh:/etc/localstack/init/ready.d/init-aws.sh
      - ./etc/aws:/etc/aws
      - ./etc/images:/etc/images
    deploy:
      resources:
        limits:
          # 1G, o dobro dos demais servicos de apoio: o s3 sync inicial das imagens ja
          # derrubou o container por OOM uma vez (ver o comentario no init.sh)
          memory: 1G
  # Serviço de email ficticio, ideal para testes local
  algashop-mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: no
    deploy:
      resources:
        limits:
          memory: 256M
  algashop-kafka-1:
    image: apache/kafka:4.3.1
    ports:
      - 9092:9092
    environment:
      KAFKA_KRAFT_CLUSTER_ID: "xiLkLerZQXaw45eXNW7qGw" # Identificador do cluster KRaft o formato deve ser id válido
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker # Define que o nó atua como controlador e broker
      KAFKA_LISTENERS: PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092 # Define os listeners para comunicação interna e externa
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://algashop-kafka-1:9090,EXTERNAL://localhost:9092 # Define os listeners anunciados para comunicação externa
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT # Mapeia os protocolos de segurança para cada listener
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@algashop-kafka-1:9091,2@algashop-kafka-2:9091,3@algashop-kafka-3:9091 # Define os votantes do quórum do controlador
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT # Define o listener para comunicação entre brokers
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # Define o listener do controlador
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 # Fator de replicação padrão para tópicos criados
      KAFKA_LOG_DIRS: /var/lib/kafka/data # Diretório de logs do Kafka
    volumes:
      - algashop-kafka-data-1:/var/lib/kafka/data
    # TCP no listener interno 9090 basta como "vivo e escutando"; a imagem apache/kafka
    # nao traz curl/nc, mas o bash do container abre socket com /dev/tcp.
    # start_period generoso: 3 nos KRaft precisam eleger quorum antes de atender.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
  algashop-kafka-2:
    image: apache/kafka:4.3.1
    ports:
      - 9093:9092
    environment:
      KAFKA_KRAFT_CLUSTER_ID: "xiLkLerZQXaw45eXNW7qGw"
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://algashop-kafka-2:9090,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@algashop-kafka-1:9091,2@algashop-kafka-2:9091,3@algashop-kafka-3:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - algashop-kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
  algashop-kafka-3:
    image: apache/kafka:4.3.1
    ports:
      - 9094:9092
    environment:
      KAFKA_KRAFT_CLUSTER_ID: "xiLkLerZQXaw45eXNW7qGw"
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://algashop-kafka-3:9090,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@algashop-kafka-1:9091,2@algashop-kafka-2:9091,3@algashop-kafka-3:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - algashop-kafka-data-3:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9090'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
  algashop-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 9084:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: algashop-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: algashop-kafka-1:9090,algashop-kafka-2:9090,algashop-kafka-3:9090
volumes:
  algashop-postgres:
  algashop-mongodb-1:
  algashop-mongodb-2:
  algashop-mongodb-3:
  algashop-kafka-data-1:
  algashop-kafka-data-2:
  algashop-kafka-data-3:
