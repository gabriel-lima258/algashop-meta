include:
  - docker-compose.tools.yml
services:
  algashop-ordering:
    image: gabriel58221/ordering:dev
    restart: no
    ports:
      - 8081:8081
    depends_on:
      algashop-postgres:
        condition: service_healthy
      algashop-redis:
        condition: service_healthy
      # config.import da AWS: sem o localstack pronto, o servico nem sobe.
      algashop-localstack:
        condition: service_healthy
      # eureka client: o registro tolera registry ausente (reconecta), mas o
      # primeiro lookup do @LoadBalanced nao - melhor esperar.
      algashop-service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 512M, nao 256M: com 256M o container morre de OOM (exit 137) por volta
          # de 1600 req/s no /api/v1/orders - medido, nao estimado. O limite de
          # memoria batia ANTES do limite de threads, e mascarava o que este
          # ambiente existe para medir.
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # As duas linhas abaixo existem para o TESTE DE CARGA, e sao o par que se
      # compara em etc/k6.
      #
      # 10 threads no Tomcat (o default e 200) e deliberadamente pouco: sem apertar
      # isso, uma maquina de desenvolvimento nao chega perto de um gargalo e o teste
      # de carga nao mede nada. Com 10, o teto aparece em segundos.
      #
      # ATENCAO: ligar spring.threads.virtual.enabled faz o Tomcat trocar o pool por
      # um executor de threads virtuais, e server.tomcat.threads.max passa a ser
      # IGNORADO - a linha continua ali, sem efeito nenhum. Nao ha aviso.
      #
      # Para virar a chave sem editar este arquivo:
      #   VIRTUAL_THREADS=true docker compose up -d --force-recreate algashop-ordering
      SERVER_TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX:-10}
      SPRING_THREADS_VIRTUAL_ENABLED: ${VIRTUAL_THREADS:-false}
  algashop-billing:
    image: gabriel58221/billing:dev
    restart: no
    ports:
      - 8082:8082
    depends_on:
      algashop-postgres:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
      algashop-service-registry:
        condition: service_healthy
    # bash + /dev/tcp em vez de curl: a imagem temurin-jre nao traz curl/wget.
    # Porta aberta = Flyway ja criou o schema (invoice etc.) - e o gate que o
    # billing-scheduler precisa antes de consultar o banco.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  # Short-lived: e um ApplicationRunner sem Tomcat (excluido no build.gradle), entao
  # sobe, cancela as faturas vencidas e ENCERRA com codigo 0. Sair nao e falha - por
  # isso restart: no, e por isso nao ha ports:. Em producao quem o reexecuta e um
  # CronJob; aqui, um "docker compose up algashop-billing-scheduler" quando quiser.
  algashop-billing-scheduler:
    image: gabriel58221/billing-scheduler:dev
    restart: no
    depends_on:
      algashop-postgres:
        condition: service_healthy
      # service_started, nao service_healthy: o fastpay nao declara healthcheck.
      fastpay:
        condition: service_started
      algashop-localstack:
        condition: service_healthy
      # o scheduler consulta a tabela invoice, criada pelo Flyway do billing:
      # sem esperar o billing healthy, num up frio ele roda contra um schema vazio.
      algashop-billing:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-product-catalog:
    image: gabriel58221/product-catalog:dev
    restart: no
    ports:
      - 8083:8083
    # A espera e pelo algashop-mongodb-init, nao pelos nos: sao os nos que ficam
    # healthy primeiro, mas o replica set so existe depois que o init roda o
    # rs.initiate(). Subir antes disso e conectar num cluster ainda nao formado.
    depends_on:
      algashop-mongodb-init:
        condition: service_completed_successfully
      algashop-redis:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
      algashop-service-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-authorization-server:
    image: gabriel58221/authorization-server:dev
    restart: no
    hostname: auth.algashop.local
    ports:
      - 9000:9000
    depends_on:
      algashop-postgres:
        condition: service_healthy
      algashop-localstack:
        condition: service_healthy
      algashop-service-registry:
        condition: service_healthy
    # bash + /dev/tcp em vez de curl: a imagem temurin-jre nao traz curl/wget.
    # Porta aberta = Flyway ja rodou e o Spring subiu: e o gate que os dependentes
    # (gateways e ecommerce-app, que fazem descoberta OIDC no bootstrap) precisam.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-service-registry:
    image: gabriel58221/service-registry:dev
    restart: no
    ports:
      - 8761:8761
    # bash + /dev/tcp em vez de curl: a imagem temurin-jre nao traz curl/wget.
    # E teste de porta, nao de readiness HTTP - suficiente para ordenar a subida
    # dos clients (que toleram registry ausente, mas o primeiro lookup balanceado nao).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8761"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-api-gateway:
    image: gabriel58221/api-gateway:dev
    restart: no
    ports:
      - 9999:9999
    depends_on:
      # o gateway so consulta o registry (fetchRegistry) - mas sem ele de pe,
      # toda rota lb:// responde 503 ate o primeiro fetch
      algashop-service-registry:
        condition: service_healthy
      # issuer-uri dispara a descoberta OIDC no bootstrap: com o authorization
      # server fora, o gateway nem sobe.
      algashop-authorization-server:
        condition: service_healthy
      # os contadores do rate limiter moram no Redis; sem ele o filtro falha
      # ABERTO (deixa passar sem limitar) - em silencio. Melhor esperar.
      algashop-redis:
        condition: service_healthy
      # config.import da AWS: sem o localstack pronto, o servico nem sobe.
      algashop-localstack:
        condition: service_healthy
    # bash + /dev/tcp em vez de curl: a imagem temurin-jre nao traz curl/wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9999"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-api-gateway-admin:
    image: gabriel58221/api-gateway-admin:dev
    restart: no
    ports:
      - 9998:9998
    depends_on:
      # o gateway so consulta o registry (fetchRegistry) - mas sem ele de pe,
      # toda rota lb:// responde 503 ate o primeiro fetch
      algashop-service-registry:
        condition: service_healthy
      # issuer-uri dispara a descoberta OIDC no bootstrap: com o authorization
      # server fora, o gateway nem sobe.
      algashop-authorization-server:
        condition: service_healthy
      # os contadores do rate limiter moram no Redis; sem ele o filtro falha
      # ABERTO (deixa passar sem limitar) - em silencio. Melhor esperar.
      algashop-redis:
        condition: service_healthy
      # config.import da AWS: sem o localstack pronto, o servico nem sobe.
      algashop-localstack:
        condition: service_healthy
    # bash + /dev/tcp em vez de curl: a imagem temurin-jre nao traz curl/wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9998"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  algashop-admin-app:
    image: algashop/algashop-admin:dev
    restart: no
    ports:
      - 4200:80
    deploy:
      resources:
        limits:
          memory: 256M
  algashop-ecommerce-app:
    image: algashop/algashop-ecommerce:dev
    restart: no
    ports:
      - 9080:9080
    depends_on:
      # issuer-uri do oauth2 client dispara a descoberta OIDC no bootstrap: com o
      # authorization server fora, o app nem sobe.
      algashop-authorization-server:
        condition: service_healthy
      # sessoes e dados do app moram no Redis; sem ele o boot/uso falha.
      algashop-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: docker

